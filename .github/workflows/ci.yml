name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  UV_VERSION: "0.12.17"

jobs:
  lint-type:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: MyPy type check
        run: uv run mypy src

  test:
    name: Tests (Unit + Integration)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras --python ${{ matrix.python-version }}

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run unit tests
        run: uv run pytest tests/unit -v -m "not network and not slow" --tb=short

      - name: Run integration tests
        run: uv run pytest tests/integration -v -m "not network and not slow" --tb=short

  test-network:
    name: Network Tests
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras --python 3.12

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Run network tests
        run: uv run pytest tests/unit tests/integration -v -m "network" --tb=short
        env:
          RUN_NETWORK_TESTS: "1"

  test-gui:
    name: GUI Tests (xvfb)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (locked)
        run: uv sync --frozen --all-extras --python 3.12

      - name: Install xvfb and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb ffmpeg

      - name: Run GUI tests
        run: |
          xvfb-run -a uv run pytest tests/unit tests/integration -v -m "gui" --tb=short
        env:
          RUN_NETWORK_TESTS: "1"
          RUN_SLOW_TESTS: "1"

  build-package:
    name: Build Package
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install build dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Build wheel and sdist
        run: uv run python -m build

      - name: Verify package
        run: uv run twine check dist/*

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  verify-clean:
    name: Verify Clean Repository
    runs-on: ubuntu-latest
    needs: [lint-type, test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --all-extras --python 3.12

      - name: Verify no runtime files tracked
        run: |
          git status --porcelain | grep -E "^(M|A|D).*(\.pyc|\.pyo|__pycache__|\.coverage|htmlcov|\.pytest_cache|\.mypy_cache|\.ruff_cache|out/|downloads/|\.venv/|venv/|dist/|build/|\.egg-info/)" && exit 1 || true
          echo "No runtime files tracked by git"

      - name: Test clean install
        run: |
          uv run python -c "import src; print('Import OK')"
          uv run python -c "from src.core.app import Application; print('App import OK')"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true